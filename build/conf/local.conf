#
# This file is intended for local configuration tweaks.
#
# If you would like to publish and share changes made to this file,
# it is recommended to put them into a distro config, or to create
# layer fragments from changes made here.
#
BB_NUMBER_THREADS = "24"
PARALLEL_MAKE = "-j 8"

# Fix for meta-raspberrypi
LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch"

# Init system
DISTRO_FEATURES:append = " systemd"
DISTRO_FEATURES:append = " usrmerge"
DISTRO_FEATURES:remove = " sysvinit"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = ""

# Basic setup
ROOT_HOME = "/root"
EXTRA_IMAGE_FEATURES += "ssh-server-openssh"
IMAGE_FSTYPES += "wic wic.bmap"
IMAGE_INSTALL:append = " systemd-networkd systemd-conf"
PACKAGECONFIG:append:pn-systemd = " networkd resolved"
IMAGE_INSTALL:append = " wpa-supplicant"
# PACKAGE_CLASSES = "package_deb"

# Boot log
ENABLE_UART = "1"
APPEND:append = " console=serial0,115200"
SERIAL_CONSOLES = "115200;serial0"

# ROS
IMAGE_INSTALL:append = " bash ros-core demo-nodes-cpp"
IMAGE_INSTALL:append = " osrf-pycommon"
RPROVIDES:osrf-pycommon += "python3-osrf-pycommon"
ALLOW_EMPTY:osrf-pycommon = "1"

#Ethercat
# For now, install on target after boot. recipe todo
IMAGE_INSTALL:append = " automake autoconf libtool pkgconfig m4"

# Tools
IMAGE_INSTALL:append = " ldd glibc-utils file binutils apt git make gcc binutils libc-dev g++"
